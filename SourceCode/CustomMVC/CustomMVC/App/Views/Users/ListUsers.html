<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>User Profile</title>
</head>
<body>
    <h1>Users</h1>
    <table border="1" cellpadding="6">
        <thead>
            <tr>
                <th>#</th>
                <th>Id</th>
                <th>Name</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            @foreach (var u in Model.Users) {
            <tr>
                <td>@index</td>
                <td>@u.Id</td>
                <td>@u.Name</td>
                <td>@u.Email</td>
                <td>
                    <a href="/users/@u.Id">Details</a>
                </td>
            </tr>
            }
        </tbody>
    </table>
</body>
</html>
